    .btn-secondary { background: #f4f6f8; color: #555555; border: 1px solid #dee3e9; }

    .btn-success { background: #2e7d32; color: #ffffff; }
    .btn-success:hover { background: #1b5e20; }
    .btn-danger { background: #d32f2f; color: #ffffff; }
    .btn-danger:hover { background: #b71c1c; }
    .btn-warning { background: #f59e0b; color: #ffffff; }
    .btn-warning:hover { background: #d97706; }

    .data-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.875rem; background: #ffffff; white-space: nowrap; }
    .data-table thead th { background-color: #f8fafc; color: #4a5568; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.6px; padding: 14px 16px; border-bottom: 2px solid #edf2f7; }
    .data-table tbody tr { border-bottom: 1px solid #edf2f7; transition: background-color 0.15s; }

  <div class="page-container">
    <div class="page-header">
      <div>
        <h1 class="page-title" id="page-title">Laporan Meeting</h1>
        <div class="breadcrumbs">
          <a href="/dashboard">Dashboard</a>
          <span>/</span>
          <a href="/laporan/all">Laporan</a>
          <span>/</span>
          <span>Meeting</span>
        </div>
      </div>
      <div class="btn-group">
        <button id="btn-export" class="btn btn-primary" title="Export Laporan Excel">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          Export
        </button>
      </div>
    </div>



    <!-- Filter & Search Card -->
    <div class="card filter-card">
      <div class="filter-bar">
        <div class="filter-controls">
          <!-- Date Range Picker -->
          <div class="date-range-group" id="date-range-container">
            <div class="date-input-wrapper">
              <label class="date-label" for="start-date">Start Date</label>
              <input type="date" id="start-date" class="date-input"/>
            </div>
            <span class="date-separator">—</span>
            <div class="date-input-wrapper">
              <label class="date-label" for="end-date">End Date</label>
              <input type="date" id="end-date" class="date-input"/>
            </div>
          </div>

          <!-- Search Input -->
          <div class="search-input-wrapper">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="search" class="search-input" placeholder="Search nama atau NIK..."/>
          </div>

          <!-- Buttons -->
          <div class="btn-group">
            <button id="btn-search" class="btn btn-primary" title="Cari Data">Search</button>
            <button id="btn-reset" class="btn btn-outline" title="Reset Filter">Reset</button>
            <button id="btn-filter" class="btn btn-secondary" title="Filter Lanjutan">
              <svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
              Filter
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Data Table Card -->
    <div class="card table-card">
      <div class="table-container">
        <table class="data-table" id="table-laporan">
          <thead>
            <tr>
            <th id="th-foto">Host</th>
            <th id="th-nama">Nama Host</th>
            <th id="th-departemen">Unit / Departemen</th>
            <th id="th-tanggal">Tanggal</th>
            <th id="th-waktu">Waktu</th>
            <th id="th-topik">Topik Meeting</th>
            <th id="th-lokasi">Ruangan / Link</th>
            <th id="th-peserta">Kehadiran</th>
            <th id="th-status">Status</th>
            <th id="th-aksi">Aksi</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Data dynamically populated by JS -->
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div class="pagination-bar">
        <div class="pagination-info" id="pagination-info">Menampilkan 1-10 dari 15 data</div>
        <div class="pagination-controls">
          <label for="rows-per-page" style="font-size:0.85rem; color:#718096; margin-right:4px;">Baris per halaman:</label>
          <select id="rows-per-page" class="rows-select">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="25">25</option>
          </select>
          <button id="btn-first-page" class="page-btn" title="Halaman Pertama">&laquo;</button>
          <button id="btn-prev-page" class="page-btn" title="Halaman Sebelumnya">&lsaquo;</button>
          <button id="btn-next-page" class="page-btn" title="Halaman Berikutnya">&rsaquo;</button>
          <button id="btn-last-page" class="page-btn" title="Halaman Terakhir">&raquo;</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Filter Dialog -->
  <div class="modal-overlay" id="filter-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Filter Laporan Meeting</h3>
        <button class="modal-close-btn" id="btn-close-filter-modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="filter-departemen">Unit / Departemen</label>
          <select id="filter-departemen" class="form-select">
            <option value="">Semua Departemen</option>
            <option value="Quality Assurance">Quality Assurance</option>
            <option value="IT Development">IT Development</option>
            <option value="Human Resources">Human Resources</option>
            <option value="Finance & Accounting">Finance & Accounting</option>
            <option value="Marketing & Sales">Marketing & Sales</option>
            <option value="Operations">Operations</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="filter-tipe-meeting">Kategori Meeting</label>
          <select id="filter-tipe-meeting" class="form-select">
            <option value="">Semua Meeting</option>
            <option value="Review">Internal</option>
            <option value="Presentation">Klien</option>
            <option value="Evaluasi">Evaluasi</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-cancel-filter" class="btn btn-secondary">Batal</button>
        <button id="btn-apply-filter" class="btn btn-primary">Terapkan</button>
      </div>
    </div>
  </div>

  <!-- Modal Detail -->
  <div class="modal-overlay" id="detail-modal">
    <div class="modal-content" style="max-width: 540px;">
      <div class="modal-header">
        <h3 class="modal-title" id="detail-modal-title">Detail Laporan Meeting</h3>
        <button class="modal-close-btn" id="btn-close-detail-modal">&times;</button>
      </div>
      <div class="modal-body" id="detail-modal-body">
        
      </div>
      <div class="modal-footer">
        <button id="btn-close-detail" class="btn btn-secondary">Tutup</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification / Snackbar -->
  <div id="snackbar" class="snackbar">
    <span id="snackbar-message">Pesan notifikasi</span>
  </div>

];
    let currentData = [...tableData];
    let currentPage = 1;
    let pageSize = 10;

    function renderTable() {
      const tableBody = document.getElementById("table-body");
      tableBody.innerHTML = "";

      if (currentData.length === 0) {
        const tr = document.createElement("tr");
        tr.className = "empty-state";
        tr.innerHTML = `<td colspan="10" style="text-align:center; padding:32px; color:#a0aec0; font-weight:500;">
          Tidak ada data yang sesuai dengan kriteria filter.
        </td>`;
        tableBody.appendChild(tr);
        document.getElementById("pagination-info").innerText = "Menampilkan 0 data";
        updatePaginationButtons();
        return;
      }

      const totalItems = currentData.length;
      const totalPages = Math.ceil(totalItems / pageSize);
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIndex = (currentPage - 1) * pageSize;
      const endIndex = Math.min(startIndex + pageSize, totalItems);
      const pageSlice = currentData.slice(startIndex, endIndex);

      pageSlice.forEach(item => {
        const tr = document.createElement("tr");
        tr.id = `row-data-${item.id}`;
        
        tr.innerHTML = `
          <td><div class="avatar-wrapper"><div class="avatar-fallback">${item.fullname.charAt(0)}</div></div></td>
          <td><div class="user-info"><span class="user-fullname">${item.fullname}</span><span class="user-nik">${item.nik}</span></div></td>
          <td><span class="dept-badge">${item.departement}</span></td>
          <td><strong>${item.date}</strong></td>
          <td>${item.time}</td>
          <td style="max-width:220px; overflow:hidden; text-overflow:ellipsis;"><strong>${item.topic}</strong></td>
          <td>${item.location}</td>
          <td><span class="badge badge-info">${item.total_attendees}</span></td>
          <td><span class="badge badge-approved">${item.status}</span></td>
          <td><button class="btn btn-outline action-btn-sm" onclick="openDetail(${item.id})">Notulensi</button></td>
        `;
    
        tableBody.appendChild(tr);
      });

      document.getElementById("pagination-info").innerText = `Menampilkan ${startIndex + 1}-${endIndex} dari ${totalItems} data`;
      updatePaginationButtons();
    }

    function updatePaginationButtons() {
      const totalPages = Math.ceil(currentData.length / pageSize) || 1;
      document.getElementById("btn-first-page").disabled = (currentPage === 1);
      document.getElementById("btn-prev-page").disabled = (currentPage === 1);
      document.getElementById("btn-next-page").disabled = (currentPage >= totalPages);
      document.getElementById("btn-last-page").disabled = (currentPage >= totalPages);
    }

    function showSnackbar(message, type = 'info') {
      const sb = document.getElementById("snackbar");
      const msg = document.getElementById("snackbar-message");
      sb.className = `snackbar show ${type}`;
      msg.innerText = message;
      setTimeout(() => { sb.className = "snackbar"; }, 3500);
    }

    // Filter Logic
    document.getElementById("btn-search").addEventListener("click", () => {
      const startDate = document.getElementById("start-date").value;
      const endDate = document.getElementById("end-date").value;
      const keyword = document.getElementById("search").value.trim().toLowerCase();

      if (startDate && endDate && startDate > endDate) {
        showSnackbar("Start date tidak boleh melebihi end date", "error");
        return;
      }

      currentData = tableData.filter(item => {
        let matchDate = true;
        const itemDate = item.date || item.start_date || item.created_at || "2026-10-25";
        if (startDate && itemDate < startDate) matchDate = false;
        if (endDate && itemDate > endDate) matchDate = false;

        let matchSearch = true;
        if (keyword) {
          const name = (item.fullname || item.name || "").toLowerCase();
          const nik = (item.nik || item.id_report || "").toLowerCase();
          matchSearch = name.includes(keyword) || nik.includes(keyword);
        }
        return matchDate && matchSearch;
      });

      currentPage = 1;
      renderTable();
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      document.getElementById("start-date").value = "";
      document.getElementById("end-date").value = "";
      document.getElementById("search").value = "";
      document.getElementById("filter-departemen").value = "";
      const catSelect = document.getElementById("filter-tipe-meeting");
      if (catSelect) catSelect.value = "";
      currentData = [...tableData];
      currentPage = 1;
      renderTable();
      showSnackbar("Filter pencarian Laporan Meeting berhasil direset", "info");
    });

    // Modal Filter
    const filterModal = document.getElementById("filter-modal");
    document.getElementById("btn-filter").addEventListener("click", () => {
      filterModal.classList.add("active");
    });
    document.getElementById("btn-close-filter-modal").addEventListener("click", () => {
      filterModal.classList.remove("active");
    });
    document.getElementById("btn-cancel-filter").addEventListener("click", () => {
      filterModal.classList.remove("active");
    });
    document.getElementById("btn-apply-filter").addEventListener("click", () => {
      const dept = document.getElementById("filter-departemen").value;
      const catSelect = document.getElementById("filter-tipe-meeting");
      const catVal = catSelect ? catSelect.value : "";

      currentData = tableData.filter(item => {
        let matchDept = dept ? item.departement === dept : true;
        let matchCat = true;
        if (catVal) {
          const itemCat = item.category || item.status || item.type || item.shift_name || "";
          matchCat = itemCat.toLowerCase().includes(catVal.toLowerCase());
        }
        return matchDept && matchCat;
      });

      currentPage = 1;
      renderTable();
      filterModal.classList.remove("active");
      showSnackbar(`Menampilkan ${currentData.length} data hasil filter`, "success");
    });

    // Detail Modal Actions
    const detailModal = document.getElementById("detail-modal");
    window.openDetail = function(id) {
      const item = tableData.find(d => d.id === id);
      if (!item) return;
      document.getElementById("detail-modal-title").innerText = `Detail - ${item.fullname || item.name || item.topic || 'Data'}`;
      detailModal.classList.add("active");
    };

    document.getElementById("btn-close-detail-modal").addEventListener("click", () => {
      detailModal.classList.remove("active");
    });
    document.getElementById("btn-close-detail").addEventListener("click", () => {
      detailModal.classList.remove("active");
    });

    // Export button
    document.getElementById("btn-export").addEventListener("click", () => {
      showSnackbar("Berhasil mengekspor Laporan Meeting ke Excel (.xlsx)", "success");
    });

    // Pagination Event Listeners
    document.getElementById("rows-per-page").addEventListener("change", (e) => {
      pageSize = parseInt(e.target.value, 10);
      currentPage = 1;
      renderTable();
    });
    document.getElementById("btn-first-page").addEventListener("click", () => {
      currentPage = 1;
      renderTable();
    });
    document.getElementById("btn-prev-page").addEventListener("click", () => {
      if (currentPage > 1) { currentPage--; renderTable(); }
    });
    document.getElementById("btn-next-page").addEventListener("click", () => {
      const totalPages = Math.ceil(currentData.length / pageSize);
      if (currentPage < totalPages) { currentPage++; renderTable(); }
    });
    document.getElementById("btn-last-page").addEventListener("click", () => {
      currentPage = Math.ceil(currentData.length / pageSize);
      renderTable();
    });

    

    renderTable();
  </script>
</body>
</html>
