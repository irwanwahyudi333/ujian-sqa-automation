  <div id="__next">
    <div class="page-container">

            <span style="color: #1e293b; font-weight: 500;">Divisi</span>

      <!-- Search & Add Bar Card -->
      <div class="filter-card">
        <div class="filter-search-container">

              <div class="input-search-wrapper">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input
                  type="search"
                  id="search"
                  name="search"
                  class="input-search"

                  aria-label="cari berdasarkan nama"

              <button type="button" id="btn-reset" class="btn btn-reset" onclick="handleReset()">Reset</button>
              <button type="submit" id="btn-search" class="btn btn-search">Search</button>
            </div>
          </form>
          <div>
            <button type="button" id="btn-tambah-divisi" class="btn button-add" onclick="openAddModal()">

            <thead>
              <tr class="MuiTableRow-root MuiTableRow-head">
                <th style="width: 35%;">NAMA Divisi</th>
                <th style="width: 25%;">TANGGAL BUAT</th>
                <th style="width: 25%;">TANGGAL UPDATE</th>
                <th style="width: 15%; text-align: center;">Aksi</th>
              </tr>
            </thead>
            <tbody id="divisi-table-body">
              <!-- Rendered dynamically by JavaScript -->
            </tbody>
          </table>
        </div>

        <!-- Table Pagination Footer -->
        <div class="pagination-bar MuiTablePagination-root">
          <div style="display: flex; align-items: center; gap: 8px;">
            <label for="rows-per-page">Rows per page:</label>
            <select id="rows-per-page" class="MuiTablePagination-select" onchange="changeRowsPerPage(this.value)">

              <option value="10" selected>10</option>
              <option value="25">25</option>

                <polyline points="18 17 13 12 18 7"></polyline>
              </svg>

            <button id="btn-prev-page" class="page-nav-btn" title="Previous Page" onclick="prevPage()">

                <polyline points="15 18 9 12 15 6"></polyline>
              </svg>
            </button>
            <button id="btn-next-page" class="page-nav-btn" title="Next Page" onclick="nextPage()">

                <polyline points="9 18 15 12 9 6"></polyline>

  <!-- Client-side Logic for Divisi Management -->
  <script>
    var divisions = window.divisions = [
      { id: "1", name: "Technology", created_at: "2026-10-20T08:30:00.000Z", updated_at: "2026-10-21T09:15:00.000Z" },
      { id: "2", name: "Human Resources", created_at: "2026-10-19T09:00:00.000Z", updated_at: "2026-10-20T10:20:00.000Z" },
      { id: "3", name: "Finance & Accounting", created_at: "2026-10-18T11:15:00.000Z", updated_at: "2026-10-19T14:00:00.000Z" },
      { id: "4", name: "Marketing & Communication", created_at: "2026-10-17T13:45:00.000Z", updated_at: "2026-10-18T16:30:00.000Z" },
      { id: "5", name: "Operations", created_at: "2026-10-16T10:00:00.000Z", updated_at: "2026-10-17T11:20:00.000Z" },
      { id: "6", name: "Quality Assurance", created_at: "2026-10-15T08:00:00.000Z", updated_at: "2026-10-16T08:45:00.000Z" },
      { id: "7", name: "Customer Support", created_at: "2026-10-14T14:10:00.000Z", updated_at: "2026-10-15T15:30:00.000Z" },
      { id: "8", name: "Product Management", created_at: "2026-10-13T09:30:00.000Z", updated_at: "2026-10-14T10:15:00.000Z" }
    ];

    var currentPage = window.currentPage = 1;
    var rowsPerPage = window.rowsPerPage = 10;
    var filteredDivisions = window.filteredDivisions = [...divisions];
    var totalPages = window.totalPages = 1;

    function formatDate(isoStr) {
      if (!isoStr) return { date: "-", time: "" };
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return { date: "-", time: "" };
      const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
      const day = String(d.getDate()).padStart(2, '0');
      const month = months[d.getMonth()];
      const year = d.getFullYear();
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      const seconds = String(d.getSeconds()).padStart(2, '0');
      return {
        date: `${day} ${month} ${year}`,
        time: `${hours}:${minutes}:${seconds}`
      };
    }

    window.renderTable = renderTable;
    function renderTable() {
      const tbody = document.getElementById("divisi-table-body");
      tbody.innerHTML = "";

      const total = filteredDivisions.length;
      totalPages = Math.ceil(total / rowsPerPage) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const startIndex = (currentPage - 1) * rowsPerPage;
      const endIndex = Math.min(startIndex + rowsPerPage, total);
      const pageData = filteredDivisions.slice(startIndex, endIndex);

      if (pageData.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td id="empty-table-message" colspan="4" style="text-align: center; padding: 32px; color: #94a3b8;">
              Tidak ada data divisi ditemukan
            </td>
          </tr>
        `;
      } else {
        pageData.forEach((item, idx) => {
          const created = formatDate(item.created_at);
          const updated = formatDate(item.updated_at);
          const tr = document.createElement("tr");
          tr.className = "MuiTableRow-root";
          tr.setAttribute("data-id", item.id);
          tr.innerHTML = `
            <td>
              <div class="cell-title">${escapeHtml(item.name)}</div>
            </td>
            <td>
              <div class="cell-date-main">${created.date}</div>
              <div class="cell-date-sub">${created.time}</div>
            </td>
            <td>
              <div class="cell-date-main">${updated.date}</div>
              <div class="cell-date-sub">${updated.time}</div>
            </td>
            <td class="action-cell">
              <div class="action-container">
                <button type="button" class="icon-btn btn-edit-direct btn-edit" title="Edit" onclick="openEditModal('${item.id}')">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </button>
                <button type="button" class="icon-btn btn-delete-direct btn-delete" title="Hapus" onclick="openDeleteModal('${item.id}')">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                  </svg>
                </button>
                <button type="button" class="icon-btn" aria-label="action" aria-haspopup="true" onclick="toggleActionMenu(event, '${item.id}')">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="1"></circle>
                    <circle cx="12" cy="5" r="1"></circle>
                    <circle cx="12" cy="19" r="1"></circle>
                  </svg>
                </button>
              </div>
              <div id="action-menu-${item.id}" class="action-menu">
                <button type="button" class="menu-item edit" onclick="openEditModal('${item.id}')">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                  Edit
                </button>
                <button type="button" class="menu-item delete" onclick="openDeleteModal('${item.id}')">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                  Delete
                </button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      // Update Pagination Text
      const from = total === 0 ? 0 : startIndex + 1;
      const to = endIndex;
      document.getElementById("displayed-rows").textContent = `${from}-${to} of ${total}`;

      // Update Pagination Button States
      document.getElementById("btn-first-page").disabled = currentPage <= 1;
      document.getElementById("btn-prev-page").disabled = currentPage <= 1;
      document.getElementById("btn-next-page").disabled = currentPage >= totalPages;
      document.getElementById("btn-last-page").disabled = currentPage >= totalPages;
    }

    function toggleActionMenu(event, id) {
      event.stopPropagation();
      document.querySelectorAll('.action-menu').forEach(m => {
        if (m.id !== `action-menu-${id}`) m.classList.remove('show');
      });
      const menu = document.getElementById(`action-menu-${id}`);
      if (menu) menu.classList.toggle('show');
    }

    window.addEventListener('click', () => {
      document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('show'));
    });

    function escapeHtml(text) {
      if (!text) return "";
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function handleSearch() {
      const query = document.getElementById("search").value.trim().toLowerCase();
      if (!query) {
        filteredDivisions = [...divisions];
      } else {
        filteredDivisions = divisions.filter(d => d.name.toLowerCase().includes(query));
      }
      currentPage = 1;
      renderTable();
    }

    function handleReset() {
      document.getElementById("search").value = "";
      filteredDivisions = [...divisions];
      currentPage = 1;
      renderTable();
    }

    function changeRowsPerPage(val) {
      rowsPerPage = parseInt(val, 10);
      currentPage = 1;
      renderTable();
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        renderTable();
      }
    }

    function nextPage() {
      if (currentPage < totalPages) {
        currentPage++;
        renderTable();
      }
    }

    function goToPage(page) {
      currentPage = page;
      renderTable();
    }

    // Modal Control
    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.add("open");
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.remove("open");
    }

    function openAddModal() {
      document.getElementById("form-tambah-divisi").reset();
      openModal("modal-tambah-divisi");
      setTimeout(() => document.getElementById("name").focus(), 100);
    }

    function handleAddSubmit() {
      const nameInput = document.getElementById("name");
      const name = nameInput.value.trim();
      if (!name) return;

      const newId = String(Date.now());
      const now = new Date().toISOString();
      const newDiv = { id: newId, name: name, created_at: now, updated_at: now };

      divisions.unshift(newDiv);
      closeModal("modal-tambah-divisi");
      handleSearch();
      showSnackbar("Berhasil Menambahkan Divisi");
    }

    function openEditModal(id) {
      const div = divisions.find(d => d.id === id);
      if (!div) return;
      document.getElementById("edit-id").value = div.id;
      document.getElementById("edit-name").value = div.name;
      openModal("modal-edit-divisi");
      setTimeout(() => document.getElementById("edit-name").focus(), 100);
    }

    function handleEditSubmit() {
      const id = document.getElementById("edit-id").value;
      const name = document.getElementById("edit-name").value.trim();
      if (!name) return;

      const div = divisions.find(d => d.id === id);
      if (div) {
        div.name = name;
        div.updated_at = new Date().toISOString();
        closeModal("modal-edit-divisi");
        renderTable();
        showSnackbar("Berhasil Edit Divisi");
      } else {
        showSnackbar("Gagal Edit Divisi");
      }
    }

    function openDeleteModal(id) {
      const div = divisions.find(d => d.id === id);
      if (!div) return;
      document.getElementById("delete-id").value = div.id;
      document.getElementById("delete-division-name").textContent = div.name;
      openModal("modal-delete-divisi");
    }

    function handleDeleteSubmit() {
      const id = document.getElementById("delete-id").value;
      const index = divisions.findIndex(d => d.id === id);
      if (index !== -1) {
        divisions.splice(index, 1);
        closeModal("modal-delete-divisi");
        handleSearch();
        showSnackbar("Berhasil Delete Divisi");
      } else {
        showSnackbar("Gagal Delete Divisi");
      }
    }

    let snackbarTimer = null;
    function showSnackbar(msg) {
      const snackbar = document.getElementById("alert-snackbar");
      const msgElem = document.getElementById("alert-message");
      if (snackbar && msgElem) {
        msgElem.textContent = msg;
        snackbar.classList.add("open");
        if (snackbarTimer) clearTimeout(snackbarTimer);
        snackbarTimer = setTimeout(() => {
          snackbar.classList.remove("open");
        }, 15000);
      }
    }

    function closeSnackbar() {
      const snackbar = document.getElementById("alert-snackbar");
      if (snackbar) snackbar.classList.remove("open");
    }

    // Escape key listener for modals
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" || e.keyCode === 27) {
        closeModal("modal-tambah-divisi");
        closeModal("modal-edit-divisi");
        closeModal("modal-delete-divisi");
      }
    });

    // Initialize table on DOM load
    document.addEventListener("DOMContentLoaded", () => {
      renderTable();
    });
  </script>
