  <script>
    let rawData = [{"id": "1", "date": "2026-01-01", "description": "Tahun Baru 2026 Masehi", "name": "Tahun Baru 2026 Masehi", "category": "Liburan Nasional"}, {"id": "2", "date": "2026-03-20", "description": "Hari Raya Idul Fitri 1447 H", "name": "Hari Raya Idul Fitri 1447 H", "category": "Liburan Nasional"}, {"id": "3", "date": "2026-03-21", "description": "Hari Raya Idul Fitri Hari Kedua", "name": "Hari Raya Idul Fitri Hari Kedua", "category": "Liburan Nasional"}, {"id": "4", "date": "2026-03-23", "description": "Cuti Bersama Idul Fitri", "name": "Cuti Bersama Idul Fitri", "category": "Cuti Bersama"}, {"id": "5", "date": "2026-05-01", "description": "Hari Buruh Internasional", "name": "Hari Buruh Internasional", "category": "Liburan Nasional"}, {"id": "6", "date": "2026-08-17", "description": "Hari Kemerdekaan RI Ke-81", "name": "Hari Kemerdekaan RI Ke-81", "category": "Liburan Nasional"}, {"id": "7", "date": "2026-12-25", "description": "Hari Raya Natal", "name": "Hari Raya Natal", "category": "Liburan Nasional"}];
    let filteredData = [...rawData];
    let currentPage = 1;
    let rowsPerPage = 10;
    let totalPages = 1;
    let targetDeleteId = null;

    function renderTable() {
      const tbody = document.getElementById("table-body");
      if (!tbody) return;
      tbody.innerHTML = "";

      const start = (currentPage - 1) * rowsPerPage;
      const end = Math.min(start + rowsPerPage, filteredData.length);
      const pageItems = filteredData.slice(start, end);

      if (pageItems.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #9ca3af; padding: 32px;">Data tidak ditemukan</td></tr>';
      } else {
        pageItems.forEach((item, index) => {
          const tr = document.createElement("tr");
          tr.className = "MuiTableRow-root";
          tr.setAttribute("data-id", item.id);
          
          let tdHtml = "";

        displayed.innerText = filteredData.length === 0 ? "0-0 of 0" : (start + 1) + "-" + end + " of " + filteredData.length;

      const btnPrev = document.getElementById("btn-prev-page");
      const btnNext = document.getElementById("btn-next-page");

      if (btnFirst) btnFirst.disabled = currentPage === 1;
      if (btnPrev) btnPrev.disabled = currentPage === 1;
      if (btnNext) btnNext.disabled = currentPage >= totalPages;
      if (btnLast) btnLast.disabled = currentPage >= totalPages;

    function handleSearch() {
      const query = (document.getElementById("search")?.value || "").toLowerCase().trim();
      if (!query) {
        filteredData = [...rawData];
      } else {
        filteredData = rawData.filter(item => {
          return Object.values(item).some(val => String(val).toLowerCase().includes(query));
        });
      }
      currentPage = 1;
      renderTable();
    }

    function handleReset() {
      const searchInput = document.getElementById("search");
      if (searchInput) searchInput.value = "";
      filteredData = [...rawData];
      currentPage = 1;
      renderTable();
    }

    function changeRowsPerPage(val) {
      rowsPerPage = parseInt(val, 10) || 10;
      currentPage = 1;
      renderTable();
    }

    function goToPage(p) {
      currentPage = Math.max(1, Math.min(p, totalPages));
      renderTable();
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        renderTable();
      }
    }

    function nextPage() {
      if (currentPage < totalPages) {
        currentPage++;
        renderTable();
      }
    }

    function openModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.add("open");
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.remove("open");
    }

    function openAddModal() {
      const form = document.getElementById("form-tambah");
      if (form) form.reset();
      openModal("modal-tambah");
    }

    function handleAddSubmit() {
      const newItem = { id: String(Date.now()) };
      
    newItem.date = document.getElementById("date")?.value || new Date().toISOString().split("T")[0];
    newItem.description = document.getElementById("description")?.value.trim() || "";
    newItem.name = newItem.description;
    newItem.category = document.getElementById("category")?.value || "Liburan Nasional";
    
      newItem.created_at = new Date().toISOString().split("T")[0];
      newItem.updated_at = new Date().toISOString().split("T")[0];

      rawData.unshift(newItem);
      handleSearch();
      closeModal("modal-tambah");
      showSnackbar("Berhasil Menambahkan Hari Libur");
    }

    function openEditModal(id) {
      const item = rawData.find(d => String(d.id) === String(id));
      if (!item) return;
      document.getElementById("edit-id").value = item.id;
      
    document.getElementById("edit-date").value = item.date || "";
    document.getElementById("edit-description").value = item.description || "";
    document.getElementById("edit-category").value = item.category || "";
    
      openModal("modal-edit");
    }

    function handleEditSubmit() {
      const id = document.getElementById("edit-id").value;
      const item = rawData.find(d => String(d.id) === String(id));
      if (item) {
        
    item.date = document.getElementById("edit-date").value;
    item.description = document.getElementById("edit-description").value.trim();
    item.name = item.description;
    item.category = document.getElementById("edit-category").value;
    
        item.updated_at = new Date().toISOString().split("T")[0];
        handleSearch();
        closeModal("modal-edit");
        showSnackbar("Berhasil Mengubah Data");
      }
    }

    function openDeleteModal(id) {
      targetDeleteId = id;
      const item = rawData.find(d => String(d.id) === String(id));
      const prompt = document.getElementById("delete-prompt-text");
      if (prompt && item) {
        prompt.innerText = "Apakah anda ingin menghapus hari libur [Nama]?".replace("[Nama]", item.name || item.title || item.fullname || "");
      }
      openModal("modal-delete");
    }

    function confirmDelete() {
      if (targetDeleteId) {
        rawData = rawData.filter(d => String(d.id) !== String(targetDeleteId));
        handleSearch();
        closeModal("modal-delete");
        showSnackbar("Berhasil Menghapus Hari Libur");
        targetDeleteId = null;
      }
    }

    function showSnackbar(msg, isError = false) {
      const sb = document.getElementById("alert-snackbar");
      const msgEl = document.getElementById("snackbar-message");
      if (sb && msgEl) {
        msgEl.innerText = msg;
        sb.className = "snackbar open" + (isError ? " error" : "");
        setTimeout(() => {
          sb.classList.remove("open");
        }, 3500);
      }
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" || e.keyCode === 27) {
        document.querySelectorAll(".modal-overlay.open").forEach(m => m.classList.remove("open"));
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      renderTable();
    });
  </script>
