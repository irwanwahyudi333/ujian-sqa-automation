name: SQA Automation & Allure Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Pilih suite pengujian yang ingin dijalankan'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api
          - ui

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Tests and Publish Allure Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Install Firefox Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y firefox

      - name: Run Test Suite
        id: run_tests
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.test_suite }}" = "api" ]; then
            echo "Menjalankan TestRunnerApi..."
            mvn clean test -Dtest=TestRunnerApi
          elif [ "${{ github.event.inputs.test_suite }}" = "ui" ]; then
            echo "Menjalankan TestRunnerUi..."
            mvn clean test -Dtest=TestRunnerUi
          else
            echo "Menjalankan seluruh Test Suite..."
            mvn clean test
          fi

      - name: Load Allure History from GitHub Pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        id: allure-report
        with:
          allure_results: target/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 25

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 7
