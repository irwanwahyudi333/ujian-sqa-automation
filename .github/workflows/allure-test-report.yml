name: SQA Automation & Allure Report

on:
  # Berjalan otomatis HANYA ketika ada pembaruan/push ke branch 'ci-test'
  push:
    branches: [ ci-test ]

  # Eksekusi manual melalui tab Actions di GitHub
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Pilih suite pengujian yang ingin dijalankan'
        required: true
        default: 'lean'
        type: choice
        options:
          - lean
          - api
          - ui
          - all

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    name: Run Tests and Publish Allure Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Verify Environment (Firefox & Java)
        run: |
          java -version
          firefox --version

      - name: Pre-fetch Dependencies & Prepare Folders
        run: |
          mvn test-compile
          mkdir -p target/allure-results
          mkdir -p gh-pages

      - name: Run Test Suite (Lean Testing Strategy by Default)
        id: run_tests
        continue-on-error: true
        run: |
          SUITE="${{ github.event.inputs.test_suite }}"
          if [ "$SUITE" = "api" ]; then
            echo "Menjalankan TestRunnerApi..."
            mvn test -Dtest=TestRunnerApi
          elif [ "$SUITE" = "ui" ]; then
            echo "Menjalankan TestRunnerUi..."
            mvn test -Dtest=TestRunnerUi
          elif [ "$SUITE" = "all" ]; then
            echo "Menjalankan seluruh Test Suite (Full Regression: UI & API)..."
            mvn test
          else
            echo "Menjalankan Skema 1 (Lean Testing Strategy: @lean)..."
            mvn test -Dcucumber.filter.tags="@lean"
          fi

      - name: Check if gh-pages branch exists
        id: check_gh_pages
        if: always()
        run: |
          has_origin=false
          if git remote | grep -q "^origin$"; then
            if git remote get-url origin >/dev/null 2>&1; then
              has_origin=true
            fi
          fi

          if [ "$has_origin" = "true" ]; then
            if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
              echo "exists=true" >> $GITHUB_OUTPUT
              echo "Branch 'gh-pages' ditemukan di remote origin."
            else
              echo "exists=false" >> $GITHUB_OUTPUT
              echo "Branch 'gh-pages' belum ada di remote origin."
            fi
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Remote 'origin' tidak terdeteksi. Melewati pengecekan remote gh-pages."
          fi

      - name: Load Allure History from GitHub Pages
        uses: actions/checkout@v4
        if: always() && steps.check_gh_pages.outputs.exists == 'true'
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Ensure Allure Directories Exist
        if: always()
        run: |
          mkdir -p target/allure-results
          mkdir -p gh-pages

      - name: Generate Allure Report
        uses: ./.github/actions/allure-report
        if: always()
        id: allure-report
        continue-on-error: true
        with:
          allure_results: target/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history
          keep_reports: 25

      - name: Fallback Native Allure Report Generation
        if: always() && steps.allure-report.outcome == 'failure'
        run: |
          echo "Docker-based Allure action gagal atau dilewati. Menjalankan fallback native runner Allure CLI..."
          if ! command -v allure &> /dev/null; then
            ALLURE_VERSION="2.29.0"
            for i in 1 2 3; do
              curl -sL "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-commandline-${ALLURE_VERSION}.tgz" -o /tmp/allure.tgz && break || sleep 2
            done
            sudo tar -zxvf /tmp/allure.tgz -C /opt/
            sudo ln -sf /opt/allure-${ALLURE_VERSION}/bin/allure /usr/local/bin/allure
          fi
          export INPUT_ALLURE_RESULTS="target/allure-results"
          export INPUT_GH_PAGES="gh-pages"
          export INPUT_ALLURE_REPORT="allure-report"
          export INPUT_ALLURE_HISTORY="allure-history"
          export INPUT_KEEP_REPORTS="25"
          bash ./.github/actions/allure-report/entrypoint.sh

      - name: Prepare Clean gh-pages Branch State
        if: always()
        run: |
          # Membersihkan branch gh-pages lokal jika ada untuk mencegah collision "fatal: a branch named 'gh-pages' already exists"
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            echo "Membersihkan branch lokal gh-pages sebelum proses deploy..."
            git branch -D gh-pages || true
          fi
          rm -f .git/index.lock || true

      - name: Deploy Allure Report to GitHub Pages
        if: always() && hashFiles('allure-history/**') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: false
          force_orphan: false

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          retention-days: 7
